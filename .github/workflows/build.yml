name: Build Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build signed universal APKs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"
            exit 1
          }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "::error::ANDROID_KEYSTORE_PASSWORD is not configured"
            exit 1
          }
          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "::error::ANDROID_KEY_PASSWORD is not configured"
            exit 1
          }
          test -n "$ANDROID_KEY_ALIAS" || {
            echo "::error::ANDROID_KEY_ALIAS is not configured"
            exit 1
          }

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/geominder-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          test -s "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew --no-daemon :app:assemblePlayRelease :app:assembleLibreRelease

      - name: Verify and stage universal APKs
        id: stage-release
        shell: bash
        run: |
          set -euo pipefail

          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt2_path="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -x "$apksigner_path"
          test -x "$aapt2_path"
          mkdir -p dist

          # "play" is the regular build; "libre" carries no Google Play services code.
          for flavor in play libre; do
            out_dir="app/build/outputs/apk/$flavor/release"
            apk_path="$out_dir/app-$flavor-release.apk"
            test -f "$apk_path" || {
              echo "::error::Signed $flavor release APK was not produced"
              exit 1
            }

            apk_count="$(find "$out_dir" -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')"
            test "$apk_count" = "1" || {
              echo "::error::Expected exactly one universal $flavor APK, found $apk_count"
              find "$out_dir" -maxdepth 1 -type f -name '*.apk' -print
              exit 1
            }

            "$apksigner_path" verify --verbose "$apk_path"

            version_name="$("$aapt2_path" dump badging "$apk_path" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
            test -n "$version_name" || {
              echo "::error::Could not read the $flavor APK version"
              exit 1
            }

            if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" != "v${version_name}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match APK version ${version_name}"
              exit 1
            fi

            if [[ "$flavor" == "libre" ]] && unzip -l "$apk_path" | grep -q 'com/google/android/gms'; then
              echo "::error::The libre APK contains Google Play services classes"
              exit 1
            fi

            suffix=""
            [[ "$flavor" == "libre" ]] && suffix="-libre"
            name="geominder-${version_name}${suffix}-universal.apk"
            cp "$apk_path" "dist/$name"
            (cd dist && sha256sum "$name" > "$name.sha256")
          done
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Upload signed universal APKs
        uses: actions/upload-artifact@v4
        with:
          name: geominder-${{ steps.stage-release.outputs.version_name }}-universal-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.stage-release.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          title="Geominder $VERSION_NAME"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --generate-notes \
              --latest \
              --verify-tag
          fi
