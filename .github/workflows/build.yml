name: Build Android release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Chimahon Lite APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Chimahon Lite
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: afn478/chimahon-lite
          ref: 079479267f027295751edeccc5f20cb1d66e74f4
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Restore and verify Geominder signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          keystore_path="$RUNNER_TEMP/geominder-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          keytool -exportcert -keystore "$keystore_path" -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -file "$RUNNER_TEMP/signing-cert.der"
          printf '%s  %s\n' \
            'b15f00f16952cf59e7f7d2abde16f58d1e8a8776c598ddbf11cd473fd07e8838' \
            "$RUNNER_TEMP/signing-cert.der" | sha256sum --check
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Install Android build tools
        run: sdkmanager 'build-tools;35.0.1' 'ndk;27.0.12077973' 'cmake;3.22.1'

      - name: Build release APKs
        run: ./gradlew --no-daemon --max-workers=4 :app:assembleRelease -PreleaseVersionName=1.3.2 -PreleaseVersionCode=10302

      - name: Sign and verify APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/35.0.1/apksigner"
          aapt2="$ANDROID_HOME/build-tools/35.0.1/aapt2"
          mkdir -p dist
          for abi in universal arm64-v8a armeabi-v7a x86 x86_64; do
            input="app/build/outputs/apk/release/app-$abi-release-unsigned.apk"
            test -f "$input"
            output="dist/chimahon-lite-$abi-v1.3.2.apk"
            "$apksigner" sign --ks "$ANDROID_KEYSTORE_PATH" --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$output" "$input"
            "$apksigner" verify --verbose --print-certs "$output" | tee "$RUNNER_TEMP/apk-verification.txt"
            grep -F 'certificate SHA-256 digest: b15f00f16952cf59e7f7d2abde16f58d1e8a8776c598ddbf11cd473fd07e8838' "$RUNNER_TEMP/apk-verification.txt"
            "$aapt2" dump badging "$output" > "$RUNNER_TEMP/apk-badging.txt"
            grep -E "^package: name='app.chimahon.lite'.*versionCode='10302'.*versionName='1.3.2'" "$RUNNER_TEMP/apk-badging.txt"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS)

      - name: Upload signed APKs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: chimahon-lite-v1.3.2-signed-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/geominder-upload.jks"
