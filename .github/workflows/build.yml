name: Build Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build signed universal APK
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.stage-release.outputs.version_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"
            exit 1
          }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "::error::ANDROID_KEYSTORE_PASSWORD is not configured"
            exit 1
          }
          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "::error::ANDROID_KEY_PASSWORD is not configured"
            exit 1
          }
          test -n "$ANDROID_KEY_ALIAS" || {
            echo "::error::ANDROID_KEY_ALIAS is not configured"
            exit 1
          }

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/geominder-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          test -s "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify and stage universal APK
        id: stage-release
        shell: bash
        run: |
          set -euo pipefail

          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk_path" || {
            echo "::error::Signed release APK was not produced"
            exit 1
          }

          apk_count="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')"
          test "$apk_count" = "1" || {
            echo "::error::Expected exactly one universal APK, found $apk_count"
            find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print
            exit 1
          }

          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt2_path="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -x "$apksigner_path"
          test -x "$aapt2_path"

          "$apksigner_path" verify --verbose "$apk_path"

          version_name="$("$aapt2_path" dump badging "$apk_path" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          test -n "$version_name" || {
            echo "::error::Could not read the APK version"
            exit 1
          }

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" != "v${version_name}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match APK version ${version_name}"
            exit 1
          fi

          mkdir -p dist
          cp "$apk_path" "dist/geominder-${version_name}-universal.apk"
          sha256sum "dist/geominder-${version_name}-universal.apk" > "dist/geominder-${version_name}-universal.apk.sha256"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Upload signed universal APK
        uses: actions/upload-artifact@v4
        with:
          name: geominder-${{ steps.stage-release.outputs.version_name }}-universal-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: geominder-${{ needs.build.outputs.version_name }}-universal-apk
          path: dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          title="Geominder $VERSION_NAME"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --generate-notes \
              --latest \
              --verify-tag
          fi
